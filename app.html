<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8622C">
<meta name="description" content="Rudi.js: gamified course to build a JavaScript engine.">
<title>Rudi.js</title>
<link rel="icon" href="assets/rudi.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-i18n-title="app.title">
<div class="app" id="app">
  <main id="main"></main>

  <nav class="tabbar" data-i18n="nav.aria" data-i18n-attr="aria-label">
    <span class="tabbar__brand"><span data-rudi data-mood="happy" data-static></span>Rudi.js</span>
    <a class="tabbar__item" data-tab="path" href="#/"><span data-icon="map"></span><span data-i18n="nav.path">Path</span></a>
    <a class="tabbar__item" data-tab="play" href="#/play"><span data-icon="code"></span><span data-i18n="nav.play">Playground</span></a>
    <a class="tabbar__item" data-tab="rank" href="#/rank"><span data-icon="trophy"></span><span data-i18n="nav.rank">Ranking</span></a>
    <a class="tabbar__item" data-tab="profile" href="#/profile"><span data-icon="user"></span><span data-i18n="nav.profile">Profile</span></a>
  </nav>
</div>

<dialog class="modal" id="modal" data-i18n="modal.aria" data-i18n-attr="aria-label"></dialog>

<script src="js/i18n.js"></script>
<script src="js/rudi.js"></script>
<script src="js/engine.js"></script>
<script src="js/course.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
<script>
  Rudi.init(document.querySelector(".tabbar"));
</script>
</body>
</html>
