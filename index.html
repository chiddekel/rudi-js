<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8622C">
<meta name="description" content="Rudi.js: grywalizowany kurs budowy silnika JavaScript.">
<title>Rudi.js</title>
<link rel="icon" href="assets/rudi.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <main id="main"></main>

  <nav class="tabbar" aria-label="Nawigacja">
    <span class="tabbar__brand"><span data-rudi data-mood="happy"></span>Rudi.js</span>
    <a class="tabbar__item" data-tab="path" href="#/"><span data-icon="map"></span>Ścieżka</a>
    <a class="tabbar__item" data-tab="play" href="#/play"><span data-icon="code"></span>Plac zabaw</a>
    <a class="tabbar__item" data-tab="rank" href="#/rank"><span data-icon="trophy"></span>Ranking</a>
    <a class="tabbar__item" data-tab="profile" href="#/profile"><span data-icon="user"></span>Profil</a>
  </nav>
</div>

<dialog class="modal" id="modal" aria-label="Okno"></dialog>

<script src="js/rudi.js"></script>
<script src="js/engine.js"></script>
<script src="js/course.js"></script>
<script src="js/app.js"></script>
<script>
  // tab icons that app.js registers after rudi.js init
  Rudi.init(document.querySelector(".tabbar"));
</script>
</body>
</html>
